# MM CostIQ: one web app on http://localhost:3000 in front of one API per tenant pack (backend/tenants/<tenant>).
# The sign-in page has an Industry switch (Life sciences = pharma, Electric utility = utility); the web app forwards each
# request to the chosen tenant's API.
#   docker compose up -d --build     build and start, then open http://localhost:3000
#   docker compose down              stop (changes are kept in the costiq-data and costiq-utility-data volumes)
#   docker compose down -v           stop and reset both tenants to their built-in data
# Ports bind to localhost because sign-in is by role. Set COSTIQ_BIND=0.0.0.0 to show it on your network.
# COSTIQ_DEFAULT_TENANT picks the tenant a first-time visitor sees (default pharma).
name: costiq

x-backend-env: &backend-env
  COSTIQ_AUTH_MODE: demo
  COSTIQ_PSEUDONYM_KEY: ${COSTIQ_PSEUDONYM_KEY:-dev-only-change-me}
  COSTIQ_ALERT_WEBHOOK_URL: ${COSTIQ_ALERT_WEBHOOK_URL:-}

services:
  backend:
    build:
      context: ./backend
      args:
        COSTIQ_TENANT: pharma
    image: mm-costiq-backend:pharma
    environment:
      <<: *backend-env
      COSTIQ_TENANT: pharma
    volumes:
      - costiq-data:/data
    ports:
      - "${COSTIQ_BIND:-127.0.0.1}:${COSTIQ_API_PORT:-8080}:8080"
    restart: unless-stopped

  backend-utility:
    build:
      context: ./backend
      args:
        COSTIQ_TENANT: utility
    image: mm-costiq-backend:utility
    environment:
      <<: *backend-env
      COSTIQ_TENANT: utility
    volumes:
      - costiq-utility-data:/data
    ports:
      - "${COSTIQ_BIND:-127.0.0.1}:${COSTIQ_UTILITY_API_PORT:-8081}:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: mm-costiq-frontend:mvp
    environment:
      COSTIQ_API_URL_PHARMA: http://backend:8080
      COSTIQ_API_URL_UTILITY: http://backend-utility:8080
      COSTIQ_DEFAULT_TENANT: ${COSTIQ_DEFAULT_TENANT:-pharma}
    ports:
      - "${COSTIQ_BIND:-127.0.0.1}:${COSTIQ_WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
      backend-utility:
        condition: service_healthy
    restart: unless-stopped

volumes:
  costiq-data:
  costiq-utility-data:
