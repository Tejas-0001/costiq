id: UT-25
source: MM CostIQ Utility extension
title: 'Transactions by FERC account: vendor, description, amount and invoice'
category: 'Utility · FERC accounting'
module: tax
business_question: 'Which transactions make up the balance of one FERC account in the period, with vendor, description, amount and invoice?'
personas:
- finance_controller
- regulatory_analyst
- auditor
- affiliate_accounting
catalog_persona: 'Controller, Regulatory Accounting'
datasets:
- 'Cost and Usage'
- 'Utility reference tables'
description: 'The transaction listing behind one FERC account: every allocated ledger line in the period with the receiving company, jurisdiction, the rule that placed it, vendor, charge description, application, cost center and the invoice and invoice line it came from. The listing a data request or an audit asks for.'
columns: 'FOCUS columns plus ref_* utility registers and allocated_cost'
keywords:
- 'transaction listing'
- 'transactions'
- 'ferc account'
- 'account detail'
- 'vendor'
- 'invoice'
- '566'
- 'data request'
products: Any provider
sql: |-
  SELECT
    PeriodStart,
    CAST(ChargePeriodStart AS DATE) AS ChargeDay,
    LegalEntity,
    Jurisdiction,
    GlAccount,
    GlTitle,
    RuleId,
    ServiceProviderName AS Vendor,
    ChargeDescription AS Description,
    Application,
    CostCenter,
    InvoiceId,
    InvoiceDetailId,
    ChargeKey,
    ROUND(AllocatedCost, 2) AS AllocatedCost
  FROM allocated_cost
  WHERE GlAccount = :account
    AND PeriodStart >= :period_start AND PeriodStart < :period_end
  ORDER BY AllocatedCost DESC, ChargeDay, ChargeKey
params:
- name: account
  type: string
  default: '566'
  label: 'FERC account'
- name: period_start
  type: date
  default: '2026-09-01'
  label: 'Start of the period (inclusive)'
- name: period_end
  type: date
  default: '2026-10-01'
  label: 'End of the period (exclusive)'
notes: 'One row per ledger line: a charge spread across companies and jurisdictions appears once per share, so the rows add up to the account balance.'
