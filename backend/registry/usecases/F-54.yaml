id: F-54
source: FinOps Foundation FOCUS 1.4
title: Analyze the different metered costs for a particular SKU
category: Reporting & Analytics
module: explorer
business_question: What are the different metered costs behind a single SKU?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
description: Understanding the individual metered costs of a particular SKU can help assist FinOps practitioners understand
  the cost breakdown of usage of a select resource.
columns: Service Provider Name, Charge Period Start, Charge Period End, SKU ID, SKU Price ID, Pricing Unit, List Unit Price,
  Pricing Quantity, List Cost, Effective Cost
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/analyze-the-different-metered-costs-for-a-particular-sku-2/
published_sql: |-
  SELECT
    ServiceProviderName,
    ChargePeriodStart,
    ChargePeriodEnd,
    SkuId,
    SkuPriceId,
    PricingUnit,
    ListUnitPrice,
    SUM(PricingQuantity) AS TotalPricingQuantity,
    SUM(ListCost) AS TotalListCost,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= ? and ChargePeriodEnd  < ?
  GROUP BY
    ServiceProviderName,
    ChargePeriodStart,
    ChargePeriodEnd,
    SkuId,
    SkuPriceId,
    PricingUnit,
    ListUnitPrice
  ORDER BY
    ChargePeriodStart ASC
  LIMIT 100
adaptation: Placeholders named
sql: |-
  SELECT
    ServiceProviderName,
    ChargePeriodStart,
    ChargePeriodEnd,
    SkuId,
    SkuPriceId,
    PricingUnit,
    ListUnitPrice,
    SUM(PricingQuantity) AS TotalPricingQuantity,
    SUM(ListCost) AS TotalListCost,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= :period_start and ChargePeriodEnd  < :period_end
  GROUP BY
    ServiceProviderName,
    ChargePeriodStart,
    ChargePeriodEnd,
    SkuId,
    SkuPriceId,
    PricingUnit,
    ListUnitPrice
  ORDER BY
    ChargePeriodStart ASC
  LIMIT 100
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: The SQL on this page is identical to the SQL on "Analyze resource costs by SKU" (51).
