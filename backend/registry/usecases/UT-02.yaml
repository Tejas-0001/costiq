id: UT-02
source: MM CostIQ Utilities extension
title: 'Service-company billing by associate company and basis of allocation'
category: 'Utilities · Affiliate allocation'
module: regulatory
business_question: 'What did the service company bill each associate company, and on which allocation basis?'
personas:
- affiliate_accounting
- regulatory_analyst
- finance_controller
- auditor
catalog_persona: 'Service-Company Accounting, Regulatory Accounting'
datasets:
- 'Cost and Usage'
- 'Utility reference tables'
description: 'A FERC Form No. 60 Schedule XXI-style view of technology costs: amounts billed to each associate company by allocation policy and statistical driver (customers, workstations, pole miles, headcount). Amounts with no approved policy are flagged.'
columns: 'FOCUS columns plus ut_* reference tables and ut_allocated_cost'
keywords:
- 'form 60'
- 'schedule xxi'
- 'methods of allocation'
- 'service company'
- 'associate company'
- 'affiliate billing'
products: Any provider
sql: |-
  SELECT
    LegalEntity AS AssociateCompany,
    COALESCE(OpcoPolicy, '(none)') AS Policy,
    COALESCE(DriverName, 'Direct (100% to one company)') AS BasisOfAllocation,
    COUNT(DISTINCT ChargeKey) AS ChargeLines,
    ROUND(SUM(AllocatedCost), 2) AS AmountBilled,
    CASE WHEN OpcoPolicy IS NULL THEN 'No approved policy' ELSE 'Approved policy' END AS Status
  FROM ut_allocated_cost
  WHERE PeriodStart >= :period_start AND PeriodStart < :period_end
  GROUP BY LegalEntity, OpcoPolicy, DriverName
  ORDER BY AssociateCompany, AmountBilled DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: 'Start of the period (inclusive)'
- name: period_end
  type: date
  default: '2026-11-01'
  label: 'End of the period (exclusive)'
notes: 'Form 60 is filed by May 1 for the prior year. This view covers technology costs allocated through CostIQ only.'
compliance:
  area: 'Affiliate allocation'
  reference: 'FERC Form No. 60, Schedule XXI (18 CFR 369.1)'
  unit: 'billing lines'
  flag: 'Status = ''No approved policy'''
  amount: AmountBilled
