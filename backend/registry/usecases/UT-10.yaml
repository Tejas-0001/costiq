id: UT-10
source: MM CostIQ Utilities extension
title: 'Technology unit costs: per customer, per AMI meter, per grid study'
category: 'Utilities · Operations & AI'
module: regulatory
business_question: 'What does technology O&M cost per customer, per smart meter and per grid study, by operating company?'
personas:
- regulatory_analyst
- cfo
- opco_finance
catalog_persona: 'Regulatory Accounting, CFO'
datasets:
- 'Cost and Usage'
- 'Utility reference tables'
description: 'Allocated technology O&M (including deferred subscriptions) divided by each entity''s volume drivers. These are the affordability measures commissions and intervenors compare across utilities.'
columns: 'FOCUS columns plus ut_* reference tables and ut_allocated_cost'
keywords:
- 'unit cost'
- 'cost per customer'
- 'cost per meter'
- 'ami'
- 'affordability'
- 'benchmark'
products: Any provider
sql: |-
  WITH cost AS (
    SELECT PeriodStart, LegalEntity, SUM(AllocatedCost) AS ItCost
    FROM ut_allocated_cost
    WHERE CostClass IN ('om', 'deferral')
    GROUP BY PeriodStart, LegalEntity
  )
  SELECT
    strftime(c.PeriodStart, '%Y-%m') AS Month,
    c.LegalEntity,
    ROUND(c.ItCost, 2) AS TechnologyOAndM,
    v.Customers,
    v.AmiMeters,
    v.GridStudies,
    ROUND(c.ItCost * 12 / NULLIF(v.Customers, 0), 2) AS AnnualizedPerCustomer,
    ROUND(c.ItCost / NULLIF(v.AmiMeters, 0), 4) AS PerMeterMonth,
    ROUND(c.ItCost / NULLIF(v.GridStudies, 0), 2) AS PerGridStudy
  FROM cost c
  JOIN ut_volume v ON v.PeriodStart = c.PeriodStart AND v.LegalEntity = c.LegalEntity
  ORDER BY Month, c.LegalEntity
params: []
notes: 'October is a partial month (data through 22 Oct).'
