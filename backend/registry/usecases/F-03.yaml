id: F-03
source: FinOps Foundation FOCUS 1.0
title: Analyze effective cost by pricing currency
category: Allocation
module: allocation
business_question: How does effective cost differ by pricing currency, and what are exchange rates costing us?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
- Billing Period
- Invoice Detail
description: Break down the effective cost by each pricing currency to surface regional price differences and exchange-rate
  impacts.
columns: Service Provider Name, Host Provider Name, Service Name, Pricing Currency, Pricing Currency Effective Cost, Billing
  Period Start, Billing Period End
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/analyze-effective-cost-by-pricing-currency-2/
published_sql: |-
  SELECT
      ServiceProviderName,
      HostProviderName,
      ServiceName,
      PricingCurrency,
      SUM(PricingCurrencyEffectiveCost) AS TotalPricingCurrencyEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= ? and ChargePeriodEnd  < ?
  GROUP BY
      ServiceProviderName,
      HostProviderName,
      ServiceName,
      PricingCurrency
adaptation: Placeholders named
sql: |-
  SELECT
      ServiceProviderName,
      HostProviderName,
      ServiceName,
      PricingCurrency,
      SUM(PricingCurrencyEffectiveCost) AS TotalPricingCurrencyEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= :period_start and ChargePeriodEnd  < :period_end
  GROUP BY
      ServiceProviderName,
      HostProviderName,
      ServiceName,
      PricingCurrency
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: '- The page lists Billing Period Start/End as columns, but the query filters on ChargePeriodStart/ChargePeriodEnd.'
