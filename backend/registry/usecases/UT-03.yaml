id: UT-03
source: MM CostIQ Utilities extension
title: 'Cross-subsidy: regulated entities carrying non-regulated work'
category: 'Utilities · Affiliate allocation'
module: utilities
business_question: 'Are regulated operating companies paying for work that belongs to a non-regulated affiliate?'
personas:
- affiliate_accounting
- regulatory_analyst
- auditor
- cfo
catalog_persona: 'Service-Company Accounting, Internal Audit'
datasets:
- 'Cost and Usage'
- 'Utility reference tables'
description: 'Finds allocated cost from cost centers owned by a non-regulated affiliate (ut_cost_center) that landed on a regulated entity. The usual cause is a broad shared-platform policy that runs before the affiliate''s own direct-assignment policy.'
columns: 'FOCUS columns plus ut_* reference tables and ut_allocated_cost'
keywords:
- 'cross subsidy'
- 'cross-subsidization'
- 'affiliate'
- 'non-regulated'
- 'renewables'
- 'affiliate wall'
products: Any provider
sql: |-
  SELECT
    a.CostCenter,
    c.OwningEntity,
    a.LegalEntity AS ChargedToEntity,
    a.OpcoPolicy,
    a.ServiceName,
    COUNT(DISTINCT a.ChargeKey) AS ChargeLines,
    ROUND(SUM(a.AllocatedCost), 2) AS CrossSubsidy
  FROM ut_allocated_cost a
  JOIN ut_cost_center c ON c.CostCenter = a.CostCenter
  WHERE NOT c.Regulated AND a.Regulated
    AND a.PeriodStart >= :period_start AND a.PeriodStart < :period_end
  GROUP BY a.CostCenter, c.OwningEntity, a.LegalEntity, a.OpcoPolicy, a.ServiceName
  ORDER BY CrossSubsidy DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: 'Start of the period (inclusive)'
- name: period_end
  type: date
  default: '2026-11-01'
  label: 'End of the period (exclusive)'
notes: 'Fix by giving the affiliate''s direct-assignment policy a lower priority number than shared-platform policies.'
compliance:
  area: 'Affiliate allocation'
  reference: 'State affiliate cost-allocation rules · PUHCA 2005'
  unit: 'allocations'
  flag: 'CrossSubsidy > 0'
  amount: CrossSubsidy
