id: F-13
source: FinOps Foundation FOCUS 1.4
title: Analyze costs by service name
category: Anomaly Management
module: anomalies
business_question: Which services drive spend, and is the growth expected?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Billing Period
- Cost and Usage
- Invoice Detail
- Contract Commitment
description: Reviewing service-level spend over a period surfaces expected and unexpected growth.
columns: Billing Period Start, Service Provider Name, Sub Account ID, Sub Account Name, Service Name, Billed Cost, Effective
  Cost
keywords:
- spend by service
- service costs
- what are we spending on
reference_url: https://focus.finops.org/docs/use-cases/v1-4/analyze-costs-by-service-name/
published_sql: |-
  SELECT
    BillingPeriodStart,
    ServiceProviderName,
    SubAccountId,
    SubAccountName,
    ServiceName,
    SUM(BilledCost) AS TotalBilledCost,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE ServiceName = ?
    AND BillingPeriodStart >= ? AND BillingPeriodStart < ?
  GROUP BY
    BillingPeriodStart,
    ServiceProviderName,
    SubAccountId,
    SubAccountName,
    ServiceName
adaptation: Placeholders named
sql: |-
  SELECT
    BillingPeriodStart,
    ServiceProviderName,
    SubAccountId,
    SubAccountName,
    ServiceName,
    SUM(BilledCost) AS TotalBilledCost,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE ServiceName = :service_name
    AND BillingPeriodStart >= :period_start AND BillingPeriodStart < :period_end
  GROUP BY
    BillingPeriodStart,
    ServiceProviderName,
    SubAccountId,
    SubAccountName,
    ServiceName
params:
- name: service_name
  type: string
  default: Amazon EC2
  label: Service name
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
