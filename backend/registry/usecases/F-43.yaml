id: F-43
source: FinOps Foundation FOCUS 1.4
title: Compare Commitment Opportunities Across Providers (Cross-Provider with SaaS)
category: Rate Optimization
module: rates
business_question: Where are commitment opportunities across clouds and SaaS platforms?
personas:
- finops_analyst
- finance_controller
- fpa_analyst
- cfo
catalog_persona: FinOps Practitioner, Finance, Procurement
datasets:
- Cost and Usage
- Invoice Detail
- Contract Commitment
description: Aggregates eligible spend and uncovered eligible spend across all providers, including SaaS platforms.
columns: Commitment Program Eligibility Details, Billed Cost, Capacity Reservation ID, Capacity Reservation Status, Charge
  Category, Charge Period End, Charge Period Start, Commitment Discount ID, Commitment Discount Status, Commitment Discount
  Type, Effective Cost, Service Name, Service Provider Name
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/compare-commitment-opportunities-across-providers-cross-provider-with-saas/
published_sql: |-
  WITH CommitmentDiscountEligible AS (
    SELECT
      CU.ServiceProviderName,
      JSON_VALUE(CP, '$.ProgramType') AS ProgramType,
      CU.EffectiveCost,
      -- EffectiveCost = BilledCost for uncovered rows; used here for ratio consistency
      CASE WHEN CU.CommitmentDiscountId IS NULL THEN CU.EffectiveCost ELSE 0 END AS UncoveredCost
    FROM focus_data_table CU
    CROSS JOIN
      UNNEST(JSON_EXTRACT_ARRAY(CU.CommitmentProgramEligibilityDetails, '$.CommitmentPrograms')) AS CP
    WHERE CU.ChargePeriodStart >= ? AND CU.ChargePeriodEnd < ?
      AND CU.ChargeCategory = 'Usage'
      AND CU.CommitmentProgramEligibilityDetails IS NOT NULL
      -- Replace with provider-specific discount-bearing program types
      AND JSON_VALUE(CP, '$.ProgramType') IN ('FlexibleSpendPlan', 'ResourceReservation')
  )
  SELECT
    ServiceProviderName,
    ProgramType AS EligibleProgramType,
    SUM(EffectiveCost) AS EligibleCost,
    SUM(UncoveredCost) AS UncoveredEligibleCost,
    SUM(UncoveredCost) / NULLIF(SUM(EffectiveCost), 0) AS UncoveredRate
  FROM CommitmentDiscountEligible
  GROUP BY ServiceProviderName, ProgramType
  ORDER BY UncoveredEligibleCost DESC
adaptation: Rewritten for portability (see notes)
sql: |-
  WITH CommitmentDiscountEligible AS (
    SELECT
      CU.ServiceProviderName,
      json_extract_string(CP.value, '$.ProgramType') AS ProgramType,
      CU.EffectiveCost,
      -- EffectiveCost = BilledCost for uncovered rows; used here for ratio consistency
      CASE WHEN CU.CommitmentDiscountId IS NULL THEN CU.EffectiveCost ELSE 0 END AS UncoveredCost
    FROM focus_data_table CU
    CROSS JOIN json_each(CU.CommitmentProgramEligibilityDetails -> 'CommitmentPrograms') AS CP
    WHERE CU.ChargePeriodStart >= :period_start AND CU.ChargePeriodEnd < :period_end
      AND CU.ChargeCategory = 'Usage'
      AND CU.CommitmentProgramEligibilityDetails IS NOT NULL
      -- Replace with provider-specific discount-bearing program types
      AND json_extract_string(CP.value, '$.ProgramType') IN ('FlexibleSpendPlan', 'ResourceReservation')
  )
  SELECT
    ServiceProviderName,
    ProgramType AS EligibleProgramType,
    SUM(EffectiveCost) AS EligibleCost,
    SUM(UncoveredCost) AS UncoveredEligibleCost,
    SUM(UncoveredCost) / NULLIF(SUM(EffectiveCost), 0) AS UncoveredRate
  FROM CommitmentDiscountEligible
  GROUP BY ServiceProviderName, ProgramType
  ORDER BY UncoveredEligibleCost DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
