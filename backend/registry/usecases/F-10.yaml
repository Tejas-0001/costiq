id: F-10
source: FinOps Foundation FOCUS 1.0
title: Report corrections by subaccount for a previously invoiced billing period
category: Allocation
module: allocation
business_question: Which subaccounts were affected by corrections to an already-invoiced period?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
- Invoice Detail
- Billing Period
description: Large organizations often pass prior-period corrections down to individual projects, subscriptions or resource
  groups, so each team can see the historical adjustments that affect its spend.
columns: Service Provider Name, Billing Account ID, Service Category, Sub Account ID, Sub Account Name, Billed Cost, Billing
  Period Start, Billing Period End, Charge Class
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/report-corrections-by-subaccount-for-a-previously-invoiced-billing-period/
published_sql: |-
  SELECT
    ServiceProviderName,
    BillingAccountId,
    ServiceCategory,
    SubAccountId,
    SubAccountName,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= ? AND BillingPeriodEnd < ?
    AND ChargeClass = 'Correction'
  GROUP BY
    ServiceProviderName,
    BillingAccountId,
    SubAccountId,
    SubAccountName,
    ServiceCategory
adaptation: Placeholders named
sql: |-
  SELECT
    ServiceProviderName,
    BillingAccountId,
    ServiceCategory,
    SubAccountId,
    SubAccountName,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= :period_start AND BillingPeriodEnd < :period_end
    AND ChargeClass = 'Correction'
  GROUP BY
    ServiceProviderName,
    BillingAccountId,
    SubAccountId,
    SubAccountName,
    ServiceCategory
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: '- Related use case: "Report corrections for a previously invoiced billing period" (Reporting & Analytics).'
