id: F-63
source: FinOps Foundation FOCUS 1.0
title: Report costs by service category and subcategory
category: Reporting & Analytics
module: explorer
business_question: How is spend split across service categories and subcategories?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
- Invoice Detail
- Billing Period
description: 'Opening phrase (verbatim): Understanding costs across service providers, billing periods, and service categories
  (Analytics, Compute, Database ... Rest of the paragraph : it names further categories such as Storage, plus service subcatego'
columns: Service Provider Name, Billing Currency, Billing Period Start, Service Category, Service Subcategory, Billed Cost,
  Billing Period End
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/report-costs-by-service-category-and-subcategory-2/
published_sql: |-
  SELECT
    ServiceProviderName,
    BillingCurrency,
    BillingPeriodStart,
    ServiceCategory,
    ServiceSubcategory,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= ? and BillingPeriodEnd  < ?
  GROUP BY
    ServiceProviderName,
    BillingCurrency,
    BillingPeriodStart,
    ServiceCategory,
    ServiceSubcategory
  ORDER BY TotalBilledCost DESC
adaptation: Placeholders named
sql: |-
  SELECT
    ServiceProviderName,
    BillingCurrency,
    BillingPeriodStart,
    ServiceCategory,
    ServiceSubcategory,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= :period_start and BillingPeriodEnd  < :period_end
  GROUP BY
    ServiceProviderName,
    BillingCurrency,
    BillingPeriodStart,
    ServiceCategory,
    ServiceSubcategory
  ORDER BY TotalBilledCost DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
