id: UT-07
source: MM CostIQ Utilities extension
title: 'BCSI held in cloud services without customer-held keys'
category: 'Utilities · NERC CIP'
module: utilities
business_question: 'Which cloud workloads hold BES Cyber System Information where the provider could decrypt it?'
personas:
- cip_compliance
- auditor
- tech_exec
catalog_persona: 'NERC CIP Compliance'
datasets:
- 'Cost and Usage'
- 'Utility reference tables'
description: 'Joins the CIP register (ut_cip_system) to cloud spend. Under CIP-004-7 and CIP-011-3, provider staff are not counted as having access to encrypted BCSI only when they cannot decrypt it; workloads that hold BCSI with provider-managed keys are flagged.'
columns: 'FOCUS columns plus ut_* reference tables and ut_allocated_cost'
keywords:
- 'bcsi'
- 'cip-011'
- 'cip-004'
- 'encryption'
- 'key management'
- 'nerc cip'
- 'customer managed keys'
products: Any provider
sql: |-
  WITH spend AS (
    SELECT json_extract_string(Tags, '$.application') AS Application, SUM(EffectiveCost) AS EffectiveCost
    FROM CostAndUsage
    WHERE ChargePeriodStart >= :period_start AND ChargePeriodStart < :period_end
    GROUP BY json_extract_string(Tags, '$.application')
  ),
  reg AS (
    SELECT s.*, CASE WHEN s.HoldsBcsi AND s.KeyOwnership <> 'customer' THEN 'Provider can decrypt BCSI'
                     WHEN s.HoldsBcsi THEN 'BCSI with customer-held keys'
                     ELSE 'No BCSI' END AS Status
    FROM ut_cip_system s
  )
  SELECT
    r.Application, r.SystemName, r.ImpactRating, r.HoldsBcsi, r.KeyOwnership, r.Owner, r.Status,
    ROUND(COALESCE(x.EffectiveCost, 0), 2) AS EffectiveCost
  FROM reg r
  LEFT JOIN spend x ON x.Application = r.Application
  ORDER BY CASE WHEN r.Status = 'Provider can decrypt BCSI' THEN 0 ELSE 1 END, EffectiveCost DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: 'Start of the period (inclusive)'
- name: period_end
  type: date
  default: '2026-11-01'
  label: 'End of the period (exclusive)'
notes: 'The CIP register is maintained by the CIP compliance team. CostIQ supplies the spend; it does not determine compliance.'
compliance:
  area: 'NERC CIP'
  reference: 'CIP-004-7 R6 · CIP-011-3 R1'
  unit: 'workloads'
  flag: 'Status = ''Provider can decrypt BCSI'''
  amount: EffectiveCost
