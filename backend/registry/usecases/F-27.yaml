id: F-27
source: FinOps Foundation FOCUS 1.4
title: Verify discount accuracy for a previously invoiced billing period (corrections excluded)
category: Data Ingestion
module: reconciliation
business_question: Were negotiated and commitment discounts applied correctly in a closed period?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
- Invoice Detail
- Billing Period
description: FinOps Practitioners need to confirm that negotiated, live, and commitment-based discounts were correctly applied
  to charges in a closed billing period. (The fetch tool returned two quoted fragments.
columns: Service Provider Name, Billing Account ID, Billing Account Name, Billing Currency, Service Name, Effective Cost,
  List Cost, Billed Cost, Billing Period Start, Billing Period End, Charge Class
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/verify-discount-accuracy-for-a-previously-invoiced-billing-period-corrections-excluded/
published_sql: |-
  SELECT
    ServiceProviderName,
    BillingAccountId,
    BillingAccountName,
    BillingCurrency,
    ServiceName,
    SUM(EffectiveCost) AS TotalEffectiveCost,
    SUM(ListCost) AS TotalListCost,
    SUM(BilledCost) AS TotalBilledCost,
    ((SUM(ListCost) - SUM(EffectiveCost)) / NULLIF(SUM(ListCost), 0)) * 100 AS EffectiveDiscount
  FROM focus_data_table
  WHERE BillingPeriodStart >= ? AND BillingPeriodEnd < ?
    AND ChargeClass != 'Correction'
  GROUP BY
    ServiceProviderName,
    BillingAccountId,
    BillingAccountName,
    BillingCurrency,
    ServiceName
adaptation: Rewritten for portability (see notes)
sql: |-
  SELECT
    ServiceProviderName,
    BillingAccountId,
    BillingAccountName,
    BillingCurrency,
    ServiceName,
    SUM(EffectiveCost) AS TotalEffectiveCost,
    SUM(ListCost) AS TotalListCost,
    SUM(BilledCost) AS TotalBilledCost,
    ((SUM(ListCost) - SUM(EffectiveCost)) / NULLIF(SUM(ListCost), 0)) * 100 AS EffectiveDiscount
  FROM focus_data_table
  WHERE BillingPeriodStart >= :period_start AND BillingPeriodEnd < :period_end
    AND (ChargeClass IS NULL OR ChargeClass <> 'Correction')
  GROUP BY
    ServiceProviderName,
    BillingAccountId,
    BillingAccountName,
    BillingCurrency,
    ServiceName
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
