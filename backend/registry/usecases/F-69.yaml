id: F-69
source: FinOps Foundation FOCUS 1.0
title: Analyze costs by availability zone for a subaccount
category: Usage Optimization
module: anomalies
business_question: Is spend spread across availability zones as designed?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
- Billing Period
- Invoice Detail
description: 'It is good practice for Engineering to monitor cost and usage of services by availability zone for all regions
  to ensure: - there isn''t any cost/usage occurring outside of the expected locations - your costs are spread according to
  an'
columns: Service Provider Name, Region Name, Availability Zone, Billing Period Start, Effective Cost, Sub Account ID, Charge
  Period Start, Charge Period End
keywords:
- availability zone
- az
- zone
reference_url: https://focus.finops.org/docs/use-cases/v1-4/analyze-costs-by-availability-zone-for-a-subaccount/
published_sql: |-
  SELECT
    ServiceProviderName,
    RegionName,
    AvailabilityZone,
    BillingPeriodStart,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE SubAccountId = ?
    AND ChargePeriodStart >= ? AND ChargePeriodEnd < ?
  GROUP BY
    ServiceProviderName,
    RegionName,
    AvailabilityZone,
    BillingPeriodStart
   ORDER BY ServiceProviderName,
    RegionName,
    AvailabilityZone,
    BillingPeriodStart
adaptation: Placeholders named
sql: |-
  SELECT
    ServiceProviderName,
    RegionName,
    AvailabilityZone,
    BillingPeriodStart,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE SubAccountId = :sub_account_id
    AND ChargePeriodStart >= :period_start AND ChargePeriodEnd < :period_end
  GROUP BY
    ServiceProviderName,
    RegionName,
    AvailabilityZone,
    BillingPeriodStart
   ORDER BY ServiceProviderName,
    RegionName,
    AvailabilityZone,
    BillingPeriodStart
params:
- name: sub_account_id
  type: string
  default: '111111111111'
  label: Sub account (AWS account, subscription, project)
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
