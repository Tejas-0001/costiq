id: F-46
source: FinOps Foundation FOCUS 1.4
title: Identify Eligible Uncovered Spend by Program Type
category: Rate Optimization
module: rates
business_question: How much eligible spend is not yet covered by a commitment, by program type?
personas:
- finops_analyst
- finance_controller
- fpa_analyst
- cfo
catalog_persona: FinOps Practitioner, Finance, Procurement
datasets:
- Cost and Usage
- Invoice Detail
- Contract Commitment
description: Identifies charges that are eligible for commitment programs but are not currently covered by a commitment discount.
columns: Commitment Program Eligibility Details, Billed Cost, Capacity Reservation ID, Capacity Reservation Status, Charge
  Category, Charge Period End, Charge Period Start, Commitment Discount ID, Commitment Discount Status, Commitment Discount
  Type, Effective Cost, Service Name, Service Provider Name
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/identify-eligible-uncovered-spend-by-program-type/
published_sql: |-
  SELECT
    CU.ServiceProviderName,
    CU.ServiceName,
    JSON_VALUE(CP, '$.ProgramType') AS EligibleProgramType,
    SUM(CU.BilledCost) AS EligibleUncoveredCost
  FROM focus_data_table CU
  CROSS JOIN
    UNNEST(JSON_EXTRACT_ARRAY(CU.CommitmentProgramEligibilityDetails, '$.CommitmentPrograms')) AS CP
  WHERE CU.ChargePeriodStart >= ? AND CU.ChargePeriodEnd < ?
    AND CU.ChargeCategory = 'Usage'
    AND CU.CommitmentDiscountId IS NULL
    AND CU.CommitmentProgramEligibilityDetails IS NOT NULL
    -- Replace with provider-specific discount-bearing program types
    AND JSON_VALUE(CP, '$.ProgramType') IN ('FlexibleSpendPlan', 'ResourceReservation')
  GROUP BY
    CU.ServiceProviderName,
    CU.ServiceName,
    JSON_VALUE(CP, '$.ProgramType')
  ORDER BY EligibleUncoveredCost DESC
adaptation: Rewritten for portability (see notes)
sql: |-
  SELECT
    CU.ServiceProviderName,
    CU.ServiceName,
    json_extract_string(CP.value, '$.ProgramType') AS EligibleProgramType,
    SUM(CU.BilledCost) AS EligibleUncoveredCost
  FROM focus_data_table CU
  CROSS JOIN json_each(CU.CommitmentProgramEligibilityDetails -> 'CommitmentPrograms') AS CP
  WHERE CU.ChargePeriodStart >= :period_start AND CU.ChargePeriodEnd < :period_end
    AND CU.ChargeCategory = 'Usage'
    AND CU.CommitmentDiscountId IS NULL
    AND CU.CommitmentProgramEligibilityDetails IS NOT NULL
    -- Replace with provider-specific discount-bearing program types
    AND json_extract_string(CP.value, '$.ProgramType') IN ('FlexibleSpendPlan', 'ResourceReservation')
  GROUP BY
    CU.ServiceProviderName,
    CU.ServiceName,
    json_extract_string(CP.value, '$.ProgramType')
  ORDER BY EligibleUncoveredCost DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
