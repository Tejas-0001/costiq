id: CO-01
source: MM CostIQ Utilities extension
title: 'Rightsizing opportunities by cost center'
category: 'Optimization · Cloud'
module: optimization
business_question: 'Which cloud resources are over-provisioned, and what would rightsizing save each month?'
personas:
- finops_analyst
- cloud_ops
- tech_exec
- cfo
catalog_persona: 'FinOps Practitioner, Cloud Operations'
datasets:
- 'Cost and Usage'
- 'Monitoring tables'
description: 'Provider rightsizing recommendations (AWS Cost Optimization Hub, Azure Advisor, Google Recommender) joined to FOCUS cost, so each recommendation carries its cost center and its last 30 days of spend, and shows whether it is already in the optimization tracker.'
columns: 'FOCUS columns plus monitoring tables (recommendations, utilization, LLM telemetry, provisioned capacity)'
keywords:
- 'rightsizing'
- 'rightsize'
- 'over-provisioned'
- 'downsize'
- 'instance size'
- 'advisor'
- 'cost optimization hub'
products: Any provider
sql: |-
  WITH spend AS (
    SELECT ResourceName, MAX(json_extract_string(Tags, '$.cost_center')) AS CostCenter, MAX(ServiceName) AS ServiceName,
           SUM(EffectiveCost) AS Last30DaysCost
    FROM CostAndUsage
    WHERE ChargePeriodStart > CAST(:as_of AS TIMESTAMP) - INTERVAL '30' DAY
      AND ChargePeriodStart <= CAST(:as_of AS TIMESTAMP)
    GROUP BY ResourceName
  )
  SELECT
    r.RecommendationId, r.Source, r.ResourceName, s.CostCenter, s.ServiceName,
    r.CurrentResourceSummary, r.RecommendedResourceSummary,
    ROUND(COALESCE(s.Last30DaysCost, r.CurrentMonthlyCost), 2) AS Last30DaysCost,
    ROUND(r.EstimatedMonthlySavings, 2) AS EstimatedMonthlySavings,
    r.Effort,
    COALESCE(a.Status, 'not tracked') AS TrackerStatus
  FROM optimization_recommendation r
  LEFT JOIN spend s ON s.ResourceName = r.ResourceName
  LEFT JOIN optimization_action a ON a.Origin = r.RecommendationId
  WHERE r.ActionType = 'rightsize'
  ORDER BY EstimatedMonthlySavings DESC
params:
- name: as_of
  type: date
  default: '2026-10-22'
  label: 'Evaluate as of'
notes: 'Savings are the provider''s estimates; CostIQ verifies them from run-rate after implementation.'
