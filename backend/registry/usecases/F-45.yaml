id: F-45
source: FinOps Foundation FOCUS 1.0
title: Identify Eligible Capacity Reservation Spend
category: Rate Optimization
module: rates
business_question: Which spend is eligible for capacity reservations, and which reservations are used?
personas:
- finops_analyst
- cloud_ops
- finance_controller
- fpa_analyst
catalog_persona: FinOps Practitioner, Engineering, Finance
datasets:
- Cost and Usage
- Invoice Detail
- Contract Commitment
description: Identifies charges eligible for capacity-reservation commitment programs, distinguishing between used and unused
  reservations.
columns: Commitment Program Eligibility Details, Billed Cost, Capacity Reservation ID, Capacity Reservation Status, Charge
  Category, Charge Period End, Charge Period Start, Commitment Discount ID, Commitment Discount Status, Commitment Discount
  Type, Effective Cost, Service Name, Service Provider Name
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/identify-eligible-capacity-reservation-spend/
published_sql: |-
  SELECT
    CU.ServiceProviderName,
    CU.ServiceName,
    JSON_VALUE(CP, '$.ProgramType') AS EligibleProgramType,
    CU.CapacityReservationStatus,
    SUM(CU.BilledCost) AS BilledCost,
    COUNT(*) AS RowCount
  FROM focus_data_table CU
  CROSS JOIN
    UNNEST(JSON_EXTRACT_ARRAY(CU.CommitmentProgramEligibilityDetails, '$.CommitmentPrograms')) AS CP
  WHERE CU.ChargePeriodStart >= ? AND CU.ChargePeriodEnd < ?
    AND CU.ChargeCategory = 'Usage'
    AND CU.CommitmentProgramEligibilityDetails IS NOT NULL
    AND JSON_VALUE(CP, '$.ProgramType') IN ('AdvanceResourceCommitment', 'ZonalResourceCommitment')
  GROUP BY
    CU.ServiceProviderName,
    CU.ServiceName,
    JSON_VALUE(CP, '$.ProgramType'),
    CU.CapacityReservationStatus
  ORDER BY BilledCost DESC
adaptation: Rewritten for portability (see notes)
sql: |-
  SELECT
    CU.ServiceProviderName,
    CU.ServiceName,
    json_extract_string(CP.value, '$.ProgramType') AS EligibleProgramType,
    CU.CapacityReservationStatus,
    SUM(CU.BilledCost) AS BilledCost,
    COUNT(*) AS RowCount
  FROM focus_data_table CU
  CROSS JOIN json_each(CU.CommitmentProgramEligibilityDetails -> 'CommitmentPrograms') AS CP
  WHERE CU.ChargePeriodStart >= :period_start AND CU.ChargePeriodEnd < :period_end
    AND CU.ChargeCategory = 'Usage'
    AND CU.CommitmentProgramEligibilityDetails IS NOT NULL
    AND json_extract_string(CP.value, '$.ProgramType') IN ('AdvanceResourceCommitment', 'ZonalResourceCommitment')
  GROUP BY
    CU.ServiceProviderName,
    CU.ServiceName,
    json_extract_string(CP.value, '$.ProgramType'),
    CU.CapacityReservationStatus
  ORDER BY BilledCost DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
