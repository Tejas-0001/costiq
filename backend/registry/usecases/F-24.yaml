id: F-24
source: FinOps Foundation FOCUS 1.0
title: Update budgets with billed costs
category: Budgeting & Forecasting
module: budgets
business_question: Are long-term budgets updated with what was actually billed?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
- Billing Period
- Invoice Detail
description: Finance manages tracking of budgets and must update long-term budgets with the actual costs billed each month
  so the budget is not exceeded.
columns: Service Provider Name, Billing Period Start, Billing Period End, Billed Cost
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/update-budgets-with-billed-costs/
published_sql: |-
  SELECT
    ServiceProviderName,
    BillingPeriodStart,
    BillingPeriodEnd,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= ? AND BillingPeriodEnd < ?
  GROUP BY
    ServiceProviderName,
    BillingPeriodStart,
    BillingPeriodEnd
adaptation: Placeholders named
sql: |-
  SELECT
    ServiceProviderName,
    BillingPeriodStart,
    BillingPeriodEnd,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= :period_start AND BillingPeriodEnd < :period_end
  GROUP BY
    ServiceProviderName,
    BillingPeriodStart,
    BillingPeriodEnd
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
