id: F-38
source: FinOps Foundation FOCUS 1.4
title: Join contract commitment details with usage charges
category: Planning & Estimating
module: rates
business_question: How does actual usage line up against each contract commitment’s terms?
personas:
- finance_controller
- fpa_analyst
- finops_analyst
- cfo
- tech_exec
catalog_persona: Finance, FinOps Practitioner, Leadership, Procurement
datasets:
- Contract Commitment
- Cost and Usage
description: Combine cost and usage data with contract commitment metadata. This enables analysis of commitment terms, categories,
  and periods alongside actual consumption.
columns: Service Provider Name, Contract Applied, Contract Commitment ID, Contract Commitment Category, Contract Commitment
  Period Start, Contract Commitment Period End, Effective Cost
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/join-contract-commitment-details-with-usage-charges/
published_sql: |-
  SELECT
    CU.ServiceProviderName,
    JSON_VALUE(CA, '$.ContractCommitmentID') AS ContractCommitmentId,
    CC.ContractCommitmentCategory,
    CC.ContractCommitmentPeriodStart,
    CC.ContractCommitmentPeriodEnd,
    CC.ContractCommitmentCost,
    SUM(CU.EffectiveCost) AS TotalUsageCost,
    SUM(CAST(JSON_VALUE(CA, '$.ContractCommitmentAppliedCost') AS FLOAT64)) AS AppliedCost
   FROM focus_data_table CU
   CROSS JOIN
    UNNEST(JSON_EXTRACT_ARRAY(CU.ContractApplied, '$.Elements')) AS CA
   JOIN contract_commitment CC
    ON JSON_VALUE(CA, '$.ContractCommitmentID') = CC.ContractCommitmentId
   WHERE CU.ChargePeriodStart >= ? AND CU.ChargePeriodEnd < ?
   GROUP BY
    CU.ServiceProviderName,
    JSON_VALUE(CA, '$.ContractCommitmentID'),
    CC.ContractCommitmentCategory,
    CC.ContractCommitmentPeriodStart,
    CC.ContractCommitmentPeriodEnd,
    CC.ContractCommitmentCost
adaptation: Rewritten for portability (see notes)
sql: |-
  SELECT
    CU.ServiceProviderName,
    json_extract_string(CA.value, '$.ContractCommitmentID') AS ContractCommitmentId,
    CC.ContractCommitmentCategory,
    CC.ContractCommitmentPeriodStart,
    CC.ContractCommitmentPeriodEnd,
    CC.ContractCommitmentCost,
    SUM(CU.EffectiveCost) AS TotalUsageCost,
    SUM(CAST(json_extract_string(CA.value, '$.ContractCommitmentAppliedCost') AS DOUBLE)) AS AppliedCost
  FROM focus_data_table CU
  CROSS JOIN json_each(CU.ContractApplied -> 'Elements') AS CA
  JOIN contract_commitment CC
    ON json_extract_string(CA.value, '$.ContractCommitmentID') = CC.ContractCommitmentId
  WHERE CU.ChargePeriodStart >= :period_start AND CU.ChargePeriodEnd < :period_end
  GROUP BY
    CU.ServiceProviderName,
    json_extract_string(CA.value, '$.ContractCommitmentID'),
    CC.ContractCommitmentCategory,
    CC.ContractCommitmentPeriodStart,
    CC.ContractCommitmentPeriodEnd,
    CC.ContractCommitmentCost
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: '- The SQL uses BigQuery-style JSON functions (JSON_VALUE, JSON_EXTRACT_ARRAY, UNNEST, FLOAT64).'
