id: F-53
source: FinOps Foundation FOCUS 1.4
title: Analyze service costs month over month
category: Reporting & Analytics
module: explorer
business_question: How has spend by service changed month over month?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Cost and Usage
- Contract Commitment
description: Analyzing service-level spending trends over a time period can expose expected and unexpected growth in the consumption
  of various services across all providers and is a good way for the FinOps team to prioritize usage and rate optimization
columns: Charge Period Start, Service Provider Name, Service Name, Effective Cost
keywords:
- month over month
- mom
- trend
- why is spend increasing
- increasing
- growth
reference_url: https://focus.finops.org/docs/use-cases/v1-4/analyze-service-costs-month-over-month/
published_sql: |-
  SELECT
    MONTH(ChargePeriodStart),
    ServiceProviderName,
    ServiceName,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= ? AND ChargePeriodStart < ?
  GROUP BY
    MONTH(ChargePeriodStart),
    ServiceProviderName,
    ServiceName
  ORDER BY
    MONTH(ChargePeriodStart),
    SUM(EffectiveCost) DESC
adaptation: Placeholders named
sql: |-
  SELECT
    MONTH(ChargePeriodStart),
    ServiceProviderName,
    ServiceName,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= :period_start AND ChargePeriodStart < :period_end
  GROUP BY
    MONTH(ChargePeriodStart),
    ServiceProviderName,
    ServiceName
  ORDER BY
    MONTH(ChargePeriodStart),
    SUM(EffectiveCost) DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
