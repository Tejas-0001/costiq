id: F-19
source: FinOps Foundation FOCUS 1.4
title: Identify unused capacity reservations
category: Anomaly Management
module: anomalies
business_question: Which capacity reservations are going unused?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
- Invoice Detail
description: Identify all data in a time period where CapacityReservationStatus is 'unused'.
columns: Service Provider Name, Billing Account ID, Capacity Reservation ID, Capacity Reservation Status, Billed Cost, Effective
  Cost, Charge Period Start, Charge Period End
keywords:
- idle capacity reservation
- unused reservation
reference_url: https://focus.finops.org/docs/use-cases/v1-4/identify-unused-capacity-reservations-2/
published_sql: |-
  SELECT
    ServiceProviderName,
    BillingAccountId,
    CapacityReservationId,
    CapacityReservationStatus,
    SUM(BilledCost) AS TotalBilledCost,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= ? AND ChargePeriodEnd < ?
    AND CapacityReservationStatus = 'Unused'
  GROUP BY
    ServiceProviderName,
    BillingAccountId,
    CapacityReservationId,
    CapacityReservationStatus,
    CommitmentDiscountStatus
adaptation: Placeholders named
sql: |-
  SELECT
    ServiceProviderName,
    BillingAccountId,
    CapacityReservationId,
    CapacityReservationStatus,
    SUM(BilledCost) AS TotalBilledCost,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= :period_start AND ChargePeriodEnd < :period_end
    AND CapacityReservationStatus = 'Unused'
  GROUP BY
    ServiceProviderName,
    BillingAccountId,
    CapacityReservationId,
    CapacityReservationStatus,
    CommitmentDiscountStatus
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: '- As published, the GROUP BY includes `CommitmentDiscountStatus`, which is not in the SELECT list and not in the page''s
  column list.'
