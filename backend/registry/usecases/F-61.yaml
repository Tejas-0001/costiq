id: F-61
source: FinOps Foundation FOCUS 1.4
title: Report corrections for a previously invoiced billing period
category: Reporting & Analytics
module: explorer
business_question: What corrections hit a period we already invoiced, and by how much?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
- Invoice Detail
- Billing Period
description: When service providers issue corrections that adjust historical invoices, practitioners must reconcile those
  adjustments against prior records.
columns: Service Provider Name, Billing Account ID, Service Category, Billed Cost, Billing Period Start, Billing Period End,
  Charge Class, Charge Category, Service Name
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/report-corrections-for-a-previously-invoiced-billing-period/
published_sql: |-
  SELECT
    ServiceProviderName,
    BillingAccountId,
    ChargeCategory,
    ServiceCategory,
    ServiceName,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= ? AND BillingPeriodEnd < ?
    AND ChargeClass = 'Correction'
  GROUP BY
    ServiceProviderName,
    BillingAccountId,
    ChargeCategory,
    ServiceCategory,
    ServiceName
adaptation: Placeholders named
sql: |-
  SELECT
    ServiceProviderName,
    BillingAccountId,
    ChargeCategory,
    ServiceCategory,
    ServiceName,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= :period_start AND BillingPeriodEnd < :period_end
    AND ChargeClass = 'Correction'
  GROUP BY
    ServiceProviderName,
    BillingAccountId,
    ChargeCategory,
    ServiceCategory,
    ServiceName
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
