id: F-29
source: FinOps Foundation FOCUS 1.0
title: Forecast amortized costs month over month based on historical trends
category: Budgeting & Forecasting
module: budgets
business_question: Where will amortized cost land in coming months based on history?
personas:
- finance_controller
- fpa_analyst
catalog_persona: Finance
datasets:
- Contract Commitment
- Cost and Usage
- Billing Period
- Invoice Detail
description: Finance needs to perform month over month forecasting by extrapolating amortized costs based on historical rates.
columns: Service Provider Name, Billing Period Start, Service Category, Service Name, Charge Category, Effective Cost, Billing
  Period End
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/forecast-amortized-costs-month-over-month-based-on-historical-trends-2/
published_sql: |-
  SELECT
    MONTH(BillingPeriodStart),
    ServiceProviderName,
    ServiceCategory,
    ServiceName,
    ChargeCategory,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= ?  AND BillingPeriodEnd < ?
  GROUP BY
    MONTH(BillingPeriodStart),
    ServiceProviderName,
    ServiceCategory,
    ServiceName,
    ChargeCategory
adaptation: Placeholders named
sql: |-
  SELECT
    MONTH(BillingPeriodStart),
    ServiceProviderName,
    ServiceCategory,
    ServiceName,
    ChargeCategory,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= :period_start  AND BillingPeriodEnd < :period_end
  GROUP BY
    MONTH(BillingPeriodStart),
    ServiceProviderName,
    ServiceCategory,
    ServiceName,
    ChargeCategory
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
