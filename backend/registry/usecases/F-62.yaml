id: F-62
source: FinOps Foundation FOCUS 1.4
title: Report costs by service category
category: Reporting & Analytics
module: explorer
business_question: How is spend split across service categories?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
- Invoice Detail
- Billing Period
description: 'Opening phrase (verbatim): Understanding costs across service providers, billing periods, and service categories
  (Analytics, Compute, Database, ... Rest of the paragraph : it lists further example categories such as Storage and states
  tha'
columns: Service Provider Name, Billing Currency, Billing Period Start, Service Category, Billed Cost, Billing Period End
keywords:
- service category
- compute vs storage
- breakdown by category
reference_url: https://focus.finops.org/docs/use-cases/v1-4/report-costs-by-service-category/
published_sql: |-
  SELECT
    ServiceProviderName,
    BillingCurrency,
    BillingPeriodStart,
    ServiceCategory,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= ? and BillingPeriodEnd < ?
  GROUP BY
    ServiceProviderName,
    BillingCurrency,
    BillingPeriodStart,
    ServiceCategory
  ORDER BY TotalBilledCost DESC
adaptation: Placeholders named
sql: |-
  SELECT
    ServiceProviderName,
    BillingCurrency,
    BillingPeriodStart,
    ServiceCategory,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= :period_start and BillingPeriodEnd < :period_end
  GROUP BY
    ServiceProviderName,
    BillingCurrency,
    BillingPeriodStart,
    ServiceCategory
  ORDER BY TotalBilledCost DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
