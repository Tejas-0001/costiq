id: UT-04
source: MM CostIQ Utilities extension
title: 'Cloud subscription fees eligible for regulatory-asset deferral'
category: 'Utilities · Regulatory accounting'
module: utilities
business_question: 'Which cloud and SaaS subscription fees could be deferred to a regulatory asset, by state?'
personas:
- regulatory_analyst
- cfo
- finance_controller
catalog_persona: 'Regulatory Accounting, CFO'
datasets:
- 'Cost and Usage'
- 'Utility reference tables'
description: 'Recurring subscription fees are O&M and earn no return unless a commission allows deferral to a regulatory asset. This view shows, per jurisdiction and vendor, what is already deferred under an order and what is still expensed where no deferral has been requested.'
columns: 'FOCUS columns plus ut_* reference tables and ut_allocated_cost'
keywords:
- 'regulatory asset'
- 'deferral'
- 'capex bias'
- 'asu 2018-15'
- 'cloud computing arrangement'
- '182.3'
products: Any provider
sql: |-
  SELECT
    a.Jurisdiction,
    p.DeferralStatus,
    a.ServiceProviderName AS Vendor,
    ROUND(SUM(a.AllocatedCost), 2) AS SubscriptionFees,
    ROUND(SUM(CASE WHEN a.CostClass = 'deferral' THEN a.AllocatedCost ELSE 0 END), 2) AS Deferred,
    ROUND(SUM(CASE WHEN a.CostClass = 'om' THEN a.AllocatedCost ELSE 0 END), 2) AS ExpensedNoReturn,
    MAX(p.AmortizationMonths) AS AmortizationMonths,
    MAX(p.OrderReference) AS OrderReference,
    CASE WHEN p.DeferralStatus = 'allowed' THEN 'Deferred under order'
         WHEN p.DeferralStatus = 'untested' THEN 'Not yet requested'
         WHEN p.DeferralStatus = 'rejected' THEN 'Rejected: re-file with a customer-savings case'
         ELSE 'Not applicable' END AS Opportunity
  FROM ut_allocated_cost a
  JOIN ut_jurisdiction_policy p ON p.Jurisdiction = a.Jurisdiction
  WHERE a.ChargeCategory = 'Purchase' AND a.ChargeFrequency = 'Recurring' AND a.CostClass IN ('om', 'deferral')
    AND a.PeriodStart >= :period_start AND a.PeriodStart < :period_end
  GROUP BY a.Jurisdiction, p.DeferralStatus, a.ServiceProviderName
  ORDER BY ExpensedNoReturn DESC, Deferred DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: 'Start of the period (inclusive)'
- name: period_end
  type: date
  default: '2026-11-01'
  label: 'End of the period (exclusive)'
notes: 'Idaho Order 34707 (2020) let Idaho Power defer non-capitalized cloud fees to a regulatory asset, amortized over the contract or 62 months. Illinois rejected an 80% deferral rule the same year.'
compliance:
  area: 'Regulatory accounting'
  reference: 'ASU 2018-15 · FERC AI20-1-000 · Idaho PUC Order No. 34707'
  unit: 'state-vendor pairs'
  flag: 'Opportunity = ''Not yet requested'''
  amount: ExpensedNoReturn
