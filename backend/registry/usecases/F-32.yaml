id: F-32
source: FinOps Foundation FOCUS 1.0
title: Report subaccounts by region
category: Governance, Policy & Risk
module: governance
business_question: Which subaccounts run in which regions, and are any outside approved locations?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Cost and Usage
- Contract Commitment
description: FinOps Practitioners must identify if there are any data residency, localization, or sovereignty inconsistencies.
columns: Service Provider Name, Sub Account ID, Region ID, Region Name, Charge Period Start, Charge Period End
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/report-subaccounts-by-region/
published_sql: |-
  SELECT
    ServiceProviderName,
    SubAccountId,
    RegionId,
    RegionName,
    COUNT(1)
  FROM focus_data_table
  WHERE ChargePeriodStart  >= ? AND ChargePeriodEnd < ?
  GROUP BY
    ServiceProviderName,
    SubAccountId,
    RegionId,
    RegionName
adaptation: Placeholders named
sql: |-
  SELECT
    ServiceProviderName,
    SubAccountId,
    RegionId,
    RegionName,
    COUNT(1)
  FROM focus_data_table
  WHERE ChargePeriodStart  >= :period_start AND ChargePeriodEnd < :period_end
  GROUP BY
    ServiceProviderName,
    SubAccountId,
    RegionId,
    RegionName
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
