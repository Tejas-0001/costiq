id: F-18
source: FinOps Foundation FOCUS 1.4
title: Identify anomalous daily spending by subaccount, region, and service
category: Anomaly Management
module: anomalies
business_question: Which subaccount, region and service combination is driving an anomaly?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
description: It is important for FinOps Practitioners to track daily spend from various angles so anomalous cost trends are
  easy to catch.
columns: Service Provider Name, Sub Account ID, Service Name, Charge Period Start, Charge Period End, Effective Cost, Region
  ID, Region Name
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/identify-anomalous-daily-spending-by-subaccount-region-and-service/
published_sql: |-
  SELECT
    DATE(ChargePeriodStart) AS Day,
    ServiceProviderName,
    SubAccountId,
    RegionId,
    RegionName,
    ServiceName,
    SUM(EffectiveCost) AS DailyEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= ? and ChargePeriodEnd  < ?
  GROUP BY
    DATE(ChargePeriodStart) AS StartDay,
    ServiceProviderName,
    SubAccountId,
    RegionId,
    RegionName,
    ServiceName
adaptation: Rewritten for portability (see notes)
sql: |-
  SELECT
    CAST(ChargePeriodStart AS DATE) AS Day,
    ServiceProviderName,
    SubAccountId,
    RegionId,
    RegionName,
    ServiceName,
    SUM(EffectiveCost) AS DailyEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= :period_start AND ChargePeriodEnd < :period_end
  GROUP BY
    CAST(ChargePeriodStart AS DATE),
    ServiceProviderName,
    SubAccountId,
    RegionId,
    RegionName,
    ServiceName
  ORDER BY Day, DailyEffectiveCost DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: '- As published, the GROUP BY clause contains an alias (`AS StartDay`), which most SQL engines reject. Remove it to
  run the query. - Previous use case: "Identify anomalous daily spending by subaccount and region". Next: "Identify unused
  capacity reservations".'
