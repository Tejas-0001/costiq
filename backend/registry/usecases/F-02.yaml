id: F-02
source: FinOps Foundation FOCUS 1.0
title: Analyze cost by participating entities
category: Allocation
module: allocation
business_question: Who actually provides, hosts and invoices each service, and where are reseller or marketplace margins?
personas:
- finance_controller
- fpa_analyst
- finops_analyst
catalog_persona: Finance, FinOps Practitioner
datasets:
- Billing Period
- Cost and Usage
- Invoice Detail
- Contract Commitment
description: Break down costs by service provider, invoice issuer and host provider to see the full value chain and find reseller
  margins or marketplace fees.
columns: Billing Period Start, Billing Period End, Service Provider Name, Invoice Issuer Name, Host Provider Name, Service
  Name, Billing Currency, Billed Cost
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/analyze-cost-by-participating-entities/
published_sql: |-
  SELECT
    BillingPeriodStart,
    BillingPeriodEnd,
    ServiceProviderName,
    InvoiceIssuerName,
    HostProviderName,
    ServiceName,
    BillingCurrency,
    SUM(BilledCost) AS TotalBilledCost
   FROM focus_data_table
   WHERE BillingPeriodStart >= ? AND BillingPeriodEnd < ?
   GROUP BY
    BillingPeriodStart,
    BillingPeriodEnd,
    ServiceProviderName,
    InvoiceIssuerName,
    HostProviderName,
    ServiceName,
    BillingCurrency
   ORDER BY TotalBilledCost DESC
adaptation: Placeholders named
sql: |-
  SELECT
    BillingPeriodStart,
    BillingPeriodEnd,
    ServiceProviderName,
    InvoiceIssuerName,
    HostProviderName,
    ServiceName,
    BillingCurrency,
    SUM(BilledCost) AS TotalBilledCost
   FROM focus_data_table
   WHERE BillingPeriodStart >= :period_start AND BillingPeriodEnd < :period_end
   GROUP BY
    BillingPeriodStart,
    BillingPeriodEnd,
    ServiceProviderName,
    InvoiceIssuerName,
    HostProviderName,
    ServiceName,
    BillingCurrency
   ORDER BY TotalBilledCost DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
