id: F-09
source: FinOps Foundation FOCUS 1.4
title: Identify sources of billed cost
category: Allocation
module: allocation
business_question: What is our true spend once duplicate charges across providers and issuers are removed?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
- Billing Period
- Invoice Detail
description: Reconcile billing data from service providers, host providers and invoice issuers to find true spend and remove
  duplicate charges.
columns: Service Provider Name, Host Provider Name, Invoice Issuer Name, Invoice ID, Billed Cost, Charge Period Start, Charge
  Period End
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/identify-sources-of-billed-cost-2/
published_sql: |-
  SELECT
      ServiceProviderName,
      HostProviderName,
      InvoiceIssuerName,
      InvoiceId,
      SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= ? and ChargePeriodEnd  < ?
  GROUP BY
      ServiceProviderName,
      HostProviderName,
      InvoiceIssuerName,
      InvoiceId
adaptation: Placeholders named
sql: |-
  SELECT
      ServiceProviderName,
      HostProviderName,
      InvoiceIssuerName,
      InvoiceId,
      SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= :period_start and ChargePeriodEnd  < :period_end
  GROUP BY
      ServiceProviderName,
      HostProviderName,
      InvoiceIssuerName,
      InvoiceId
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
