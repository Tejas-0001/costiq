id: F-14
source: FinOps Foundation FOCUS 1.0
title: Analyze service costs by region
category: Anomaly Management
module: anomalies
business_question: How is service spend trending by region across all providers?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Cost and Usage
- Contract Commitment
description: Tracking service-level spend over time, by region and across all service providers, shows expected and unexpected
  growth.
columns: Charge Period Start, Service Provider Name, Region ID, Service Name, Effective Cost, Charge Period End
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/analyze-service-costs-by-region-2/
published_sql: |-
  SELECT
    ChargePeriodStart,
    ServiceProviderName,
    RegionId,
    ServiceName,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= ? and ChargePeriodEnd  < ?
  GROUP BY
    ChargePeriodStart,
    ServiceProviderName,
    RegionId,
    ServiceName
  ORDER BY ChargePeriodStart,
    SUM(EffectiveCost) DESC
adaptation: Placeholders named
sql: |-
  SELECT
    ChargePeriodStart,
    ServiceProviderName,
    RegionId,
    ServiceName,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE ChargePeriodStart >= :period_start and ChargePeriodEnd  < :period_end
  GROUP BY
    ChargePeriodStart,
    ServiceProviderName,
    RegionId,
    ServiceName
  ORDER BY ChargePeriodStart,
    SUM(EffectiveCost) DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
