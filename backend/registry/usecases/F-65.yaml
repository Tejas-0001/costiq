id: F-65
source: FinOps Foundation FOCUS 1.4
title: Report service costs by providers subaccount
category: Reporting & Analytics
module: explorer
business_question: What does each provider subaccount spend by service, to support private pricing talks?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
- Billing Period
- Invoice Detail
description: Organizations wants to negotiate private pricing for a particular workload, a subaccount that carries specialized
  workloads, or their entire footprint.
columns: Service Provider Name, Service Name, Sub Account ID, Charge Period Start, Effective Cost, Billing Period Start, Billing
  Period End, Effective Cost (listed a second time on the page)
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/report-service-costs-by-providers-subaccount-2/
published_sql: |-
  SELECT
    ServiceProviderName,
    ServiceName,
    SubAccountId,
    ChargePeriodStart,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= ? AND BillingPeriodEnd < ?
    AND SubAccountId = ?
    AND ServiceProviderName = ?
  GROUP BY
    ServiceProviderName,
    ServiceName,
    SubAccountId,
    ChargePeriodStart
  ORDER BY
    SUM(EffectiveCost),
    BillingPeriodStart DESC
adaptation: Rewritten for portability (see notes)
sql: |-
  SELECT
    ServiceProviderName,
    ServiceName,
    SubAccountId,
    ChargePeriodStart,
    SUM(EffectiveCost) AS TotalEffectiveCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= :period_start AND BillingPeriodEnd < :period_end
    AND SubAccountId = :sub_account_id
    AND ServiceProviderName = :provider
  GROUP BY
    ServiceProviderName,
    ServiceName,
    SubAccountId,
    ChargePeriodStart
  ORDER BY
    SUM(EffectiveCost),
    MIN(BillingPeriodStart) DESC
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
- name: sub_account_id
  type: string
  default: '111111111111'
  label: Sub account (AWS account, subscription, project)
- name: provider
  type: string
  default: AWS
  label: Service provider name
notes: '- The v1.3 and v1.4 queries are identical. - As written, the ORDER BY uses BillingPeriodStart, which is not in the
  GROUP BY, so strict SQL engines may reject the query.'
