id: F-26
source: FinOps Foundation FOCUS 1.4
title: Verify accuracy of services charges across service providers
category: Data Ingestion
module: reconciliation
business_question: Are service charges consistent across providers and their invoices?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Contract Commitment
- Cost and Usage
- Invoice Detail
- Billing Period
description: A FinOps Practitioner checks that charges in the FOCUS dataset match service provider invoices.
columns: Service Provider Name, Billing Account ID, Billing Account Name, Billing Currency, Service Name, Billed Cost, Billing
  Period Start, Billing Period End
keywords: []
reference_url: https://focus.finops.org/docs/use-cases/v1-4/verify-accuracy-of-services-charges-across-service-providers/
published_sql: |-
  SELECT
    ServiceProviderName,
    BillingAccountId,
    BillingAccountName,
    BillingCurrency,
    ServiceName,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= ? AND BillingPeriodEnd < ?
  GROUP BY
    ServiceProviderName,
    BillingAccountName,
    BillingAccountId,
    BillingCurrency,
    ServiceName
adaptation: Placeholders named
sql: |-
  SELECT
    ServiceProviderName,
    BillingAccountId,
    BillingAccountName,
    BillingCurrency,
    ServiceName,
    SUM(BilledCost) AS TotalBilledCost
  FROM focus_data_table
  WHERE BillingPeriodStart >= :period_start AND BillingPeriodEnd < :period_end
  GROUP BY
    ServiceProviderName,
    BillingAccountName,
    BillingAccountId,
    BillingCurrency,
    ServiceName
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
