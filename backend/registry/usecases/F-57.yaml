id: F-57
source: FinOps Foundation FOCUS 1.0
title: Determine Effective Savings Rate
category: Reporting & Analytics
module: explorer
business_question: What is our Effective Savings Rate on commitments?
personas:
- finops_analyst
catalog_persona: FinOps Practitioner
datasets:
- Cost and Usage
description: The Effective Savings Rate (ESR) is a KPI to track the efficiency of using commitment discounts. **Outcome:**
  FinOps Practitioners are able to compute the ESR, which is (Contracted Cost – Effective Cost) / Contracted Cost.
columns: Contracted Cost, Effective Cost, Charge Period Start, Charge Period End
keywords:
- esr
- effective savings rate
- how much are we saving
reference_url: https://focus.finops.org/docs/use-cases/v1-4/determine-effective-savings-rate/
published_sql: |-
  SELECT
    SUM(ContractedCost) AS ContractedCost,
    SUM(EffectiveCost) AS EffectiveCost,
    (SUM(ContractedCost) - SUM(EffectiveCost)) / NULLIF(SUM(ContractedCost), 0) AS EffectiveSavingsRate
  FROM focus_data_table
  WHERE ChargePeriodStart >= ? AND ChargePeriodEnd < ?
adaptation: Placeholders named
sql: |-
  SELECT
    SUM(ContractedCost) AS ContractedCost,
    SUM(EffectiveCost) AS EffectiveCost,
    (SUM(ContractedCost) - SUM(EffectiveCost)) / NULLIF(SUM(ContractedCost), 0) AS EffectiveSavingsRate
  FROM focus_data_table
  WHERE ChargePeriodStart >= :period_start AND ChargePeriodEnd < :period_end
params:
- name: period_start
  type: date
  default: '2026-07-01'
  label: Start of the period (inclusive)
- name: period_end
  type: date
  default: '2026-11-01'
  label: End of the period (exclusive)
notes: ''
